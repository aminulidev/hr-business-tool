<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981" />
      <stop offset="100%" style="stop-color:#047857" />
    </linearGradient>
    <linearGradient id="calcGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff" />
      <stop offset="100%" style="stop-color:#f1f5f9" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>
  
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  
  <g filter="url(#shadow)">
    <!-- Main Calculator Body -->
    <rect x="136" y="104" width="240" height="304" rx="24" fill="url(#calcGrad)" />
    
    <!-- Screen -->
    <rect x="168" y="144" width="176" height="64" rx="8" fill="#e2e8f0" />
    <rect x="184" y="160" width="144" height="32" rx="4" fill="#047857" opacity="0.1" />
    
    <!-- Buttons -->
    <rect x="168" y="240" width="40" height="40" rx="8" fill="#cbd5e1" />
    <rect x="236" y="240" width="40" height="40" rx="8" fill="#cbd5e1" />
    <rect x="304" y="240" width="40" height="40" rx="8" fill="#cbd5e1" />
    
    <rect x="168" y="304" width="40" height="40" rx="8" fill="#cbd5e1" />
    <rect x="236" y="304" width="40" height="40" rx="8" fill="#cbd5e1" />
    <!-- Equal/Action Button -->
    <rect x="304" y="304" width="40" height="40" rx="8" fill="#10b981" />
  </g>
</svg>
