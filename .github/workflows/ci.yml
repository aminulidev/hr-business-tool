name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Unit tests (payroll engine, registry invariants, generated content, sitemap)
        run: npm test

      - name: Lint (blocking since Phase 14.4 — react-hooks rules are enforced)
        run: npm run lint

      - name: Build (type-checks and statically generates every published page)
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
